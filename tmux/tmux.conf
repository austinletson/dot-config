unbind C-b
# -- Key bindings --
set -g prefix C-a
bind C-a send-prefix

# vim like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set new windows/panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}" # Split panes horizontal
bind - split-window -v -c "#{pane_current_path}" # Split panes vertically

# set vi mode keys
set-window-option -g mode-keys vi

bind -n M-m copy-mode

# Use n/p to jump to next and previous prompt
bind -T copy-mode-vi n send-keys -X next-prompt
bind -T copy-mode-vi p send-keys -X previous-prompt
bind -n M-n copy-mode \; send-keys -X next-prompt
bind -n M-p copy-mode \; send-keys -X previous-prompt

# Use d/u to scroll down and up in copy mode
bind -T copy-mode-vi d send-keys -X halfpage-down
bind -T copy-mode-vi u send-keys -X halfpage-up 

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Create session from ghq repo
bind-key G display-popup -E -w 80% -h 60% "bash ~/.config/scripts/tmux_ghq_session.sh"

# Create new worktree from branch
bind-key W display-popup -E -w 80% -h 60% "bash ~/.config/scripts/tmux_git_worktree_session.sh"

# Session switcher popup with Ctrl-A O
bind o display-popup -E -h 40% -w 60% -y 100% "\
  session=\$(tmux list-sessions -F '#{session_last_attached} #S' | grep -v \" \$(tmux display-message -p '#S')\$\" | sort -rn | cut -d' ' -f2 | fzf --reverse --header 'Switch to session:' --border); \
  [ -n \"\$session\" ] && tmux switch-client -t \"\$session\""

# Copy mode
bind -T copy-mode-vi v send -X begin-selection

# Integrate tmux clipboard with macos clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# -- Plugins --
# Install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Morantron/tmux-fingers'

# Color scheme
set -g @plugin 'niksingh710/minimal-tmux-status'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


